name: nutri-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutri-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nutrition_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nutrition_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nutri-ai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    container_name: nutri-ai-backend
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nutrition_agent}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATASET_ROOT: /datasets/nutrition_project
      EXPORTS_ROOT: /datasets/nutrition_project/exports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./dataset/nutrition_project:/datasets/nutrition_project
      - backend_uploads:/app/app/storage/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  celery-worker:
    container_name: nutri-ai-celery-worker
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "app.workers.celery_worker:celery_app", "worker", "--loglevel=info", "--pool=solo", "-Q", "nutrition"]
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nutrition_agent}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATASET_ROOT: /datasets/nutrition_project
      EXPORTS_ROOT: /datasets/nutrition_project/exports
    volumes:
      - ./dataset/nutrition_project:/datasets/nutrition_project
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    container_name: nutri-ai-celery-beat
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "app.workers.celery_worker:celery_app", "beat", "--loglevel=info"]
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nutrition_agent}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATASET_ROOT: /datasets/nutrition_project
      EXPORTS_ROOT: /datasets/nutrition_project/exports
    volumes:
      - ./dataset/nutrition_project:/datasets/nutrition_project
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: nutri-ai-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://127.0.0.1:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
